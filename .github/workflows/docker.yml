name: Docker

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'docker/session-test-5'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker release version
        id: version
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/docker/session-test-5)
              echo "version=0.0.0-session-test.5" >> "$GITHUB_OUTPUT"
              ;;
            refs/tags/v*)
              echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected ref for Docker release: $GITHUB_REF" >&2
              exit 1
              ;;
          esac

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          build-args: |
            OBSCURA_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/obscura:${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published amd64 and arm64 images
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/obscura:${{ steps.version.outputs.version }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            actual="$(docker run --rm --platform "$platform" "$IMAGE" --version)"
            echo "$platform: $actual"
            if [[ "$actual" != *"$EXPECTED_VERSION"* ]]; then
              echo "Image version mismatch for $platform: $actual" >&2
              exit 1
            fi
          done
