name: ANGLE Metal - macOS ARM64 engine validation

on:
  push:
    branches: [feat/angle-metal-webgl-arm64-candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angle-metal-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angle-core:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin
      - name: Validate pinned ANGLE bundle builder
        run: python3 -m unittest discover -s graphics -p test_build_dependencies.py
      - name: Compile and test native WebGL engine (no bundle required)
        run: cargo test --locked --target aarch64-apple-darwin -p obscura-webgl --lib -- --skip driver_tests
      - name: Validate JavaScript ANGLE bindings
        run: node --test crates/obscura-js/tests/webgl_bindings.cjs crates/obscura-js/tests/offscreen_bindings.cjs
      - name: Verify existing macOS ARM64 baseline remains buildable
        run: cargo build --locked --profile release-dist --target aarch64-apple-darwin -p obscura-cli --bins --features render
