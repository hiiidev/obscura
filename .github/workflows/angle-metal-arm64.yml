name: ANGLE Metal - macOS ARM64 engine validation

on:
  push:
    branches: [feat/angle-metal-webgl-arm64-candidate]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: angle-metal-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angle-core:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin
      - name: Validate pinned ANGLE bundle builder
        run: python3 -m unittest discover -s graphics -p test_build_dependencies.py
      - name: Compile and test native WebGL engine (no bundle required)
        run: cargo test --locked --target aarch64-apple-darwin -p obscura-webgl --lib -- --skip driver_tests
      # These upstream VM fixtures extract sections of a newer bootstrap.js.
      # Do not report their output as a valid gate until the adapter is ported.
      # They remain in the repository and must be re-enabled before shipping.
      - name: ANGLE JS binding/Canvas integration gate (pending)
        if: ${{ false }}
        run: node --test crates/obscura-js/tests/webgl_bindings.cjs crates/obscura-js/tests/offscreen_bindings.cjs
      - name: Compile native ANGLE WebGL bindings into Apple Silicon browser
        run: cargo build --locked --profile release-dist --target aarch64-apple-darwin -p obscura-cli --bins --features webgl
      - name: Package Apple Silicon ANGLE integration candidate (native bundle separate)
        run: |
          tar -czf obscura-aarch64-macos-angle-candidate.tar.gz -C target/aarch64-apple-darwin/release-dist obscura obscura-worker
          shasum -a 256 obscura-aarch64-macos-angle-candidate.tar.gz > SHA256SUMS.txt
      - name: Upload opt-in ANGLE candidate (not a Release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obscura-aarch64-macos-angle-integration
          path: |
            obscura-aarch64-macos-angle-candidate.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # This job uses the browser built by the same run and the native dylibs
  # from the successful pinned builder on its separate isolation branch.
  # A green Rust-only build is not sufficient to verify native WebGL.
  native-metal-smoke:
    needs: angle-core
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      OBSCURA_WEBGL_BACKEND: hardware
      NATIVE_RUN_ID: "38054498511"
      NATIVE_HEAD_SHA: "9f53c51b45a861e0e12c90e39c37b5504a829e2e"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify host and download both successful build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          root="$RUNNER_TEMP/angle-smoke"
          mkdir -p "$root/downloads/browser" "$root/downloads/angle" "$root/browser" "$root/bundle" "$root/logs" "$root/captures"
          printf 'candidate=%s\nnative_run=%s\nnative_head=%s\nhost=%s\n' \
            "$GITHUB_SHA" "$NATIVE_RUN_ID" "$NATIVE_HEAD_SHA" "$(uname -m)" > "$root/logs/identity.txt"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" --jq .head_sha)" = "$NATIVE_HEAD_SHA"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name obscura-aarch64-macos-angle-integration --dir "$root/downloads/browser"
          gh run download "$NATIVE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name angle-metal-aarch64-macos-pinned-bundle --dir "$root/downloads/angle"
          (cd "$root/downloads/browser" && shasum -a 256 -c SHA256SUMS.txt)
          (cd "$root/downloads/angle" && shasum -a 256 -c ANGLE-METAL-SHA256SUMS.txt)
          tar -xzf "$root/downloads/browser/obscura-aarch64-macos-angle-candidate.tar.gz" -C "$root/browser"
          tar -xzf "$root/downloads/angle/angle-metal-aarch64-macos.tar.gz" -C "$root/bundle"
          test -s "$root/bundle/bundle.json"
          test -s "$root/bundle/libEGL.dylib"
          test -s "$root/bundle/libGLESv2.dylib"
          for executable in "$root/browser/obscura" "$root/browser/obscura-worker"; do
            test -x "$executable"
            lipo -archs "$executable" | grep -qw arm64
          done
          for library in "$root/bundle/libEGL.dylib" "$root/bundle/libGLESv2.dylib"; do
            lipo -archs "$library" | grep -qw arm64
          done
          shasum -a 256 "$root/browser/"* "$root/bundle/"*.dylib >> "$root/logs/identity.txt"
          python3 -m json.tool "$root/bundle/bundle.json" > "$root/logs/bundle.json"
          sw_vers >> "$root/logs/identity.txt"
      - name: Install pinned Playwright driver for CDP validation
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/angle-smoke/venv"
          "$RUNNER_TEMP/angle-smoke/venv/bin/python" -m pip install --disable-pip-version-check playwright==1.55.0
      - name: WebGL1/2 core Metal shaders, pixels, Canvas and screenshot
        env:
          OBSCURA_WEBGL_LIB_DIR: ${{ runner.temp }}/angle-smoke/bundle
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/angle-smoke"
          "$root/browser/obscura" --allow-private-network serve \
            --host 127.0.0.1 --port 9333 --storage-dir "$root/profile" \
            > "$root/logs/obscura-server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9333/json/version > "$root/logs/cdp-version.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Obscura CDP server exited before readiness"
              cat "$root/logs/obscura-server.log"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { echo "Obscura CDP server never became ready"; exit 1; }
          "$root/venv/bin/python" render-repros/webgl/run.py \
            --endpoint http://127.0.0.1:9333 --out "$root/captures/metal-core-1" --scope core
          "$root/venv/bin/python" render-repros/webgl/run.py \
            --endpoint http://127.0.0.1:9333 --out "$root/captures/metal-core-2" --scope core
      - name: Native ANGLE Metal context ownership and cleanup tests
        env:
          OBSCURA_WEBGL_LIB_DIR: ${{ runner.temp }}/angle-smoke/bundle
          OBSCURA_WEBGL_TEST_BACKEND: metal
          CARGO_BUILD_JOBS: "2"
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/angle-smoke"
          rustc --version | tee "$root/logs/driver-rust-version.txt"
          cargo --version | tee -a "$root/logs/driver-rust-version.txt"
          # This crate has no V8 isolate, so each exact ignored real-driver
          # test can safely run in its own cargo-test process. V8 fixtures
          # require a separately configured nextest gate and remain pending.
          for name in \
            real_webgl1_and_webgl2_buffers_start_zero_and_render_clear \
            real_shaders_buffers_and_drawing_produce_pixels_in_both_versions \
            real_contexts_do_not_share_drawing_buffers_or_gl_state \
            real_resize_clears_pixels_and_allocation_failure_retains_old_surface \
            real_new_and_resized_drawing_buffers_never_expose_freed_surface_memory \
            real_repeated_context_cleanup_releases_live_gl_objects \
            initial_activation_failure_rejects_creation \
            initial_clear_failure_rejects_creation \
            activation_failure_after_creation_loses_context; do
            echo "::group::native-driver $name"
            cargo test --locked --target aarch64-apple-darwin \
              -p obscura-webgl --lib "driver_tests::$name" \
              -- --ignored --exact --nocapture \
              2>&1 | tee "$root/logs/driver-$name.log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed' "$root/logs/driver-$name.log"
            echo "::endgroup::"
          done
      # Keep optional canvas transfer failures distinct from Metal WebGL core.
      # This is a required-but-pending acceptance gate, not a known-green test.
      - name: OffscreenCanvas placeholder and SVG presentation acceptance
        env:
          OBSCURA_WEBGL_LIB_DIR: ${{ runner.temp }}/angle-smoke/bundle
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/angle-smoke"
          "$root/browser/obscura" --allow-private-network serve \
            --host 127.0.0.1 --port 9334 --storage-dir "$root/offscreen-profile" \
            > "$root/logs/obscura-offscreen.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9334/json/version > "$root/logs/offscreen-cdp-version.json"; then
              ready=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$root/logs/obscura-offscreen.log"
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1 || { echo "Offscreen test CDP server not ready"; exit 1; }
          "$root/venv/bin/python" render-repros/webgl/run.py \
            --endpoint http://127.0.0.1:9334 --out "$root/captures/metal-presentation" --scope presentation
      - name: Preserve Metal validation evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obscura-metal-webgl-runtime-evidence
          path: |
            ${{ runner.temp }}/angle-smoke/logs/
            ${{ runner.temp }}/angle-smoke/captures/
          if-no-files-found: warn
          retention-days: 14

  js-webgl-bindings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify standalone WebGL JavaScript binding semantics
        run: |
          node --version
          node --test crates/obscura-js/tests/webgl_bindings.cjs
