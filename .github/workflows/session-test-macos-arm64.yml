name: Session test macOS ARM64 (candidate only)

# Candidate branch only; no release or multi-platform build.
on:
  push:
    branches:
      - fix/context-timezone-frame-playwright-macos-arm64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session-macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64:
    name: Build obscura-aarch64-macos
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin
      - name: Build render-enabled Apple Silicon candidate
        run: cargo build --profile release-dist --target aarch64-apple-darwin -p obscura-cli --bins --features render
      - name: Smoke test V8 initialization
        run: |
          target/aarch64-apple-darwin/release-dist/obscura fetch \
            'data:text/html,<title>smoke</title>' --eval 'new Date(2024,0,1).getFullYear()'
      - name: Package manual-test archive (not a GitHub release)
        run: |
          tar -czf obscura-aarch64-macos.tar.gz \
            -C target/aarch64-apple-darwin/release-dist obscura obscura-worker
          shasum -a 256 obscura-aarch64-macos.tar.gz > SHA256SUMS.txt
      - name: Upload Apple Silicon candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obscura-aarch64-macos-session-candidate
          path: |
            obscura-aarch64-macos.tar.gz
            SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
